name: ida_agrico
description: ida agrico project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.0
  image_picker: ^1.0.4
  intl: ^0.20.2
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  # Share.shareXFiles works the same as in 9.x.
  share_plus: ^10.1.4
  image: ^4.1.7
  url_launcher: ^6.3.0
  camera: ^0.11.0
  google_mlkit_face_detection: any
  google_mlkit_text_recognition: any
  flutter_litert: any
  # Precision agriculture: farm boundary drawing/viewing + satellite
  # imagery. flutter_map is the Flutter equivalent of the Leaflet
  # library already used on the web app - same tile source (Esri World
  # Imagery, free, no API key), same general approach.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.69.0
  # Notifications (Sep 2026, no outside push service): the app checks the
  # server for new notifications - every ~15 min in the background with
  # workmanager - and shows them with flutter_local_notifications.
  # workmanager is pinned to the Aug 2025 release (0.9.0+3). Its parts
  # (android / apple / platform_interface) are pinned too, under
  # dependency_overrides below: newer part versions don't fit together
  # and break the build. flutter_local_notifications is kept on 19.x (its
  # API changed in 20+).
  workmanager: 0.9.0+3
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/idalogo.png
    - assets/models/mobilefacenet.tflite
# FlutLab's package cache has incomplete copies of string_scanner 1.4.1 /
# term_glyph 1.2.2 (missing files → compile errors). Pin the previous
# versions. Safe to remove when building with a normal Flutter install.
dependency_overrides:
  # workmanager 0.9.0+3's matching parts (released together, Aug 2025).
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1
  string_scanner: 1.3.0
  term_glyph: 1.2.1
  source_span: 1.10.0