org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Added for Face Recognition's heavier native dependencies (TFLite/
# LiteRT + ML Kit + CameraX all link native libraries, and the release
# build's R8 minification step is memory-hungry on top of that). The
# previous -Xmx8G was likely CAUSING the "Gradle build daemon
# disappeared" crash, not preventing it — in a resource-capped build
# container, asking for more heap than is physically available can get
# the whole process killed before it even gets going. Lower + less
# parallel is the safer setting in a constrained CI-style environment.
org.gradle.parallel=false
org.gradle.workers.max=1
# One-shot build — no benefit from daemon reuse here, and a persistent
# background daemon is exactly what got killed in your error log.
org.gradle.daemon=false