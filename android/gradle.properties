# Memory for the build. FlutLab's build machine has a fixed memory limit:
# if Gradle asks for more than is really there, the machine kills it
# ("Gradle build daemon disappeared unexpectedly"). 4 GB of heap is enough
# for the release build (R8) with ML Kit + LiteRT + CameraX, and keeps the
# whole build well under the limit. (Was -Xmx8G + 4G metaspace, which
# failed on 30 Sep 2026 once the notification plugins were added.)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Compile Kotlin inside the Gradle process instead of starting a second
# Kotlin process next to it (that second process needs its own memory).
kotlin.compiler.execution.strategy=in-process

# One thing at a time, and no background Gradle process kept alive:
# safer in a build machine with limited memory.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false